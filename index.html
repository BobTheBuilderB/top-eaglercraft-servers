                    searchInput.style.borderColor = 'var(--accent-color)';
                    searchInput.style.boxShadow = '0 0 20px rgba(0, 255, 255, 0.3)';
                } else {
                    searchInput.style.borderColor = 'var(--border-color)';
                    searchInput.style.boxShadow = 'none';
                }
                
                renderServers();
            });

            // Enhanced filter tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    
                    // Add click effect
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                    
                    renderServers();
                });
            });
        }

        function filterServers() {
            return serverData.filter(server => {
                const matchesFilter = currentFilter === 'all' || 
                    server.tags.includes(currentFilter) || 
                    server.gamemode.toLowerCase().includes(currentFilter);

                const matchesSearch = searchQuery === '' ||
                    server.name.toLowerCase().includes(searchQuery) ||
                    server.description.toLowerCase().includes(searchQuery) ||
                    server.tags.some(tag => tag.includes(searchQuery)) ||
                    server.gamemode.toLowerCase().includes(searchQuery);

                return matchesFilter && matchesSearch;
            });
        }

        // Enhanced server rendering with techy animations
        function renderServers() {
            const filteredServers = filterServers();
            const serversGrid = document.getElementById('serversGrid');
            
            if (filteredServers.length === 0) {
                serversGrid.innerHTML = `
                    <div class="error">
                        <h3>>>> NO SERVERS FOUND IN DATABASE</h3>
                        <p>>>> ADJUST SEARCH PARAMETERS OR FILTER SELECTION</p>
                        <p>>>> ERROR_CODE: 0x404_NO_NODES</p>
                    </div>
                `;
                return;
            }
            
            // Add staggered animation
            serversGrid.innerHTML = '';
            filteredServers.forEach((server, index) => {
                setTimeout(() => {
                    const serverCard = createServerCard(server);
                    serversGrid.appendChild(serverCard);
                }, index * 100);
            });
        }

        function createServerCard(server) {
            const cardElement = document.createElement('div');
            cardElement.className = 'server-card';
            cardElement.style.opacity = '0';
            cardElement.style.transform = 'translateY(30px)';
            
            cardElement.innerHTML = `
                <div class="server-rank">#${server.rank}</div>
                <div class="server-name">
                    <span class="status-indicator ${server.status}"></span>
                    ${server.name}
                </div>
                
                <div class="server-address">
                    ${server.address}
                </div>
                
                <div class="server-stats">
                    <div class="stat">
                        <div class="stat-value">${server.players}</div>
                        <div class="stat-label">Active Users</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${server.version}</div>
                        <div class="stat-label">Protocol Ver</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value">${server.uptime}</div>
                        <div class="stat-label">Uptime</div>
                    </div>
                </div>
                
                <div class="server-description">
                    ${server.description}
                </div>
                
                <div class="server-tags">
                    ${server.tags.map(tag => `<span class="tag">${tag.toUpperCase()}</span>`).join('')}
                </div>
                
                <button class="connect-btn" onclick="copyAddress('${server.address}')">
                    [COPY_ADDRESS]
                </button>
            `;
            
            // Animate in
            setTimeout(() => {
                cardElement.style.transition = 'all 0.6s ease';
                cardElement.style.opacity = '1';
                cardElement.style.transform = 'translateY(0)';
            }, 50);
            
            return cardElement;
        }

        // Enhanced copy function with techy feedback
        function copyAddress(address) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(address).then(() => {
                    showTechyNotification('>>> ADDRESS_COPIED_TO_CLIPBOARD', 'success');
                }).catch(() => {
                    fallbackCopyTextToClipboard(address);
                });
            } else {
                fallbackCopyTextToClipboard(address);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                showTechyNotification('>>> ADDRESS_COPIED_TO_CLIPBOARD', 'success');
            } catch (err) {
                showTechyNotification('>>> ERROR: COPY_OPERATION_FAILED', 'error');
            }
            
            document.body.removeChild(textArea);
        }

        // Techy notification system
        function showTechyNotification(message, type = 'info') {
            const notification = document.createElement('div');
            const bgColor = type === 'success' ? 'linear-gradient(45deg, #00ff88, #00d2ff)' : 
                           type === 'error' ? 'linear-gradient(45deg, #ff4444, #ff8888)' : 
                           'linear-gradient(45deg, var(--accent-color), var(--accent-secondary))';
            
            notification.style.cssText = `
                position: fixed;
                top: 30px;
                right: 30px;
                background: ${bgColor};
                color: var(--primary-bg);
                padding: 20px 30px;
                border-radius: 12px;
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
                z-index: 10000;
                font-weight: 600;
                font-family: 'JetBrains Mono', monospace;
                border: 1px solid rgba(255, 255, 255, 0.2);
                backdrop-filter: blur(10px);
                transform: translateX(100%);
                transition: transform 0.4s ease;
            `;
            
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // Animate in
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            // Animate out
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => notification.remove(), 400);
            }, 3000);
        }

        // Enhanced global stats with techy counters
        function updateGlobalStats() {
            const totalServers = serverData.length;
            const totalPlayers = serverData.reduce((sum, server) => {
                const playerRange = server.players.split('-');
                const avgPlayers = Math.round((parseInt(playerRange[0]) + parseInt(playerRange[1])) / 2);
                return sum + avgPlayers;
            }, 0);
            
            // Animate numbers
            animateCounter('totalServers', totalServers, '+');
            animateCounter('totalPlayers', Math.floor(totalPlayers / 1000) * 1000, 'K+', 1000);
            animateCounter('totalGamemodes', 25, '+');
        }

        function animateCounter(elementId, targetValue, suffix = '', divisor = 1) {
            const element = document.getElementById(elementId);
            const startValue = 0;
            const increment = Math.ceil(targetValue / 50);
            let currentValue = startValue;
            
            const timer = setInterval(() => {
                currentValue += increment;
                if (currentValue >= targetValue) {
                    currentValue = targetValue;
                    clearInterval(timer);
                }
                
                const displayValue = divisor > 1 ? 
                    (currentValue / divisor).toFixed(1) : 
                    currentValue;
                    
                element.textContent = displayValue + suffix;
            }, 30);
        }

        document.addEventListener('DOMContentLoaded', init);
