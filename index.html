        }

        }

        }

            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            color: white;
            font-size: 3rem;

            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.9);

        }
        
        .search-container {
            position: relative;

        }
        
        #searchInput {
            width: 100%;
            padding: 15px 50px 15px 20px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }
        
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .filter-tab {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .filter-tab:hover, .filter-tab.active {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
        
        .server-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .server-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        
        .server-rank {
            position: absolute;
            top: -10px;
            right: -10px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .server-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .server-address {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            border-left: 4px solid #3498db;
        }
        
        .server-stats {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }
        
        .stat {
            text-align: center;
            flex: 1;
        }
        
        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }
        
        .server-description {
            color: #555;
            line-height: 1.5;
            margin: 15px 0;
        }
        
        .server-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
        }
        
        .tag {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .connect-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #10ac84, #00d2d3);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 172, 132, 0.4);
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .online {
            background: #27ae60;
            animation: pulse 2s infinite;
        }
        
        .offline {
            background: #e74c3c;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .stats-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .global-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            color: white;
        }
        
        .global-stat {
            text-align: center;
        }
        
        .global-stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .global-stat-label {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .servers-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .server-stats {
                flex-direction: column;
                gap: 10px;
            }
            
            .filter-tabs {
                justify-content: center;
            }
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
        }
        
        .error {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>

            {

                version: "1.8-1.19",
                status: "online",
                description: "Prison-themed server with ranking system, mines, and economy. Work your way to freedom!",
                tags: ["prison", "economy", "ranking"],
                gamemode: "Prison",
                uptime: "98.1%"
            },
            {
                rank: 12,
                name: "Faction Wars",
                address: "wss://faction-wars.com/",
                players: "60-100",
                maxPlayers: "180",
                version: "1.8-1.16",
                status: "online",
                description: "Faction-based PvP server with claims, raids, and territorial warfare.",
                tags: ["factions", "pvp", "raids", "warfare"],
                gamemode: "Factions",
                uptime: "97.5%"
            }

        let currentFilter = 'all';
        let searchQuery = '';

        // Initialize the page
        function init() {
            renderServers();
            setupEventListeners();
            updateGlobalStats();
        }

        // Setup event listeners
        function setupEventListeners() {
            // Search functionality
            document.getElementById('searchInput').addEventListener('input', function(e) {
                searchQuery = e.target.value.toLowerCase();
                renderServers();
            });

            // Filter tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    // Remove active class from all tabs
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    // Add active class to clicked tab
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderServers();
                });
            });
        }

        // Filter servers based on current criteria
        function filterServers() {
            return serverData.filter(server => {
                // Filter by category
                const matchesFilter = currentFilter === 'all' || 
                    server.tags.includes(currentFilter) || 
                    server.gamemode.toLowerCase().includes(currentFilter);

                // Filter by search query
                const matchesSearch = searchQuery === '' ||
                    server.name.toLowerCase().includes(searchQuery) ||
                    server.description.toLowerCase().includes(searchQuery) ||
                    server.tags.some(tag => tag.includes(searchQuery)) ||
                    server.gamemode.toLowerCase().includes(searchQuery);

                return matchesFilter && matchesSearch;
            });
        }

        // Render servers to the page
        function renderServers() {
            const filteredServers = filterServers();
            const serversGrid = document.getElementById('serversGrid');
            
            if (filteredServers.length === 0) {
                serversGrid.innerHTML = `
                    <div class="error">
                        <h3>No servers found</h3>
                        <p>Try adjusting your search criteria or filter selection.</p>
                    </div>
                `;
                return;
            }
            
            serversGrid.innerHTML = filteredServers.map(server => `
                <div class="server-card" data-tags="${server.tags.join(' ')}">
                    <div class="server-rank">#${server.rank}</div>
                    <div class="server-name">
                        <span class="status-indicator ${server.status}"></span>
                        ${server.name}
                    </div>
                    
                    <div class="server-address">
                        <strong>Address:</strong> ${server.address}
                    </div>
                    
                    <div class="server-stats">
                        <div class="stat">
                            <div class="stat-value">${server.players}</div>
                            <div class="stat-label">Players Online</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${server.version}</div>
                            <div class="stat-label">Version</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${server.uptime}</div>
                            <div class="stat-label">Uptime</div>
                        </div>
                    </div>
                    
                    <div class="server-description">
                        ${server.description}
                    </div>
                    
                    <div class="server-tags">
                        ${server.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                    
                    <button class="connect-btn" onclick="copyAddress('${server.address}')">
                        📋 Copy Address
                    </button>
                </div>
            `).join('');
        }

        // Copy server address to clipboard
        function copyAddress(address) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(address).then(() => {
                    showNotification('Address copied to clipboard!');
                }).catch(() => {
                    fallbackCopyTextToClipboard(address);
                });
            } else {
                fallbackCopyTextToClipboard(address);
            }
        }

        // Fallback copy method for older browsers
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                showNotification('Address copied to clipboard!');
            } catch (err) {
                showNotification('Failed to copy address. Please copy manually.');
            }
            
            document.body.removeChild(textArea);
        }

        // Show notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(45deg, #10ac84, #00d2d3);
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                z-index: 10000;
                font-weight: bold;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideIn {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
            `;
            document.head.appendChild(style);
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
                style.remove();
            }, 3000);
        }

        // Update global statistics
        function updateGlobalStats() {
            const totalServers = serverData.length;
            const totalPlayers = serverData.reduce((sum, server) => {
                const playerRange = server.players.split('-');
                const avgPlayers = Math.round((parseInt(playerRange[0]) + parseInt(playerRange[1])) / 2);
                return sum + avgPlayers;
            }, 0);
            
            document.getElementById('totalServers').textContent = totalServers + '+';
            document.getElementById('totalPlayers').textContent = totalPlayers.toLocaleString() + '+';
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
